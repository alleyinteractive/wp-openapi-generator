name: wp-openapi-generator@plugin-feature

inputs:
  - name: featureName
    description: "Feature Name"
    type: string
  - name: tests
    description: "Include Tests?"
    type: boolean
    default: true

files:
  - source: feature.php.hbs
    destination: src/Features/{{ wpClassName inputs.featureName }}.php
  - source: test.php.hbs
    if: "{{ inputs.tests }}"
    destination: tests/Feature/{{ psr4ClassFilename inputs.featureName suffix="Test.php" }}
